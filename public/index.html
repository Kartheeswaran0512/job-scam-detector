<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Scam Detector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7fb; --ink: #0f172a; --body: #334155; --muted: #64748b; --line: #e2e8f0;
    --brand: #4f46e5; --brand-soft: #eef2ff;
    --high: #dc2626; --high-soft: #fef2f2; --high-line: #fecaca;
    --medium: #d97706; --medium-soft: #fffbeb; --medium-line: #fde68a;
    --low: #16a34a; --low-soft: #f0fdf4; --low-line: #bbf7d0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: radial-gradient(900px 480px at 50% -8%, #e0e7ff 0%, rgba(224,231,255,0) 70%), var(--bg); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  nav { max-width: 1120px; margin: 0 auto; padding: 22px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
  .mark { width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: #fff; display: grid; place-items: center; }
  .report { color: var(--ink); font-size: 14px; font-weight: 500; text-decoration: none; border: 1px solid var(--line); background: #fff; padding: 8px 14px; border-radius: 8px; white-space: nowrap; }
  .report:hover { border-color: #cbd5e1; }

  main { max-width: 760px; margin: 30px auto 0; padding: 0 24px 64px; }
  .intro { text-align: center; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--brand); background: var(--brand-soft); border: 1px solid #e0e7ff; padding: 6px 12px; border-radius: 999px; }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
  h1 { font-size: 46px; line-height: 1.08; letter-spacing: -.03em; font-weight: 700; margin: 18px 0 14px; }
  .lede { font-size: 17px; line-height: 1.55; color: var(--muted); max-width: 620px; margin: 0 auto; }

  .card { margin-top: 30px; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 30px; box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 24px 48px -24px rgba(15,23,42,.18); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 18px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 8px; }
  label span { font-weight: 400; color: var(--muted); }
  .field { position: relative; display: flex; align-items: center; }
  .field svg { position: absolute; left: 14px; color: #94a3b8; width: 17px; height: 17px; pointer-events: none; }
  .field:focus-within svg { color: var(--brand); }
  input, select { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 15px; color: var(--ink); background: #fff; outline: 0; }
  .field input { padding: 0 14px 0 42px; }
  input::placeholder { color: #a0aec0; }
  .field input:focus, .money:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(79,70,229,.14); }
  .money { display: flex; height: 46px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .money select { width: 104px; height: 100%; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: #f8fafc; padding: 0 12px; font-weight: 500; cursor: pointer; }
  .money input { height: 100%; border: 0; border-radius: 0; padding: 0 14px; }
  .money .per { display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: var(--muted); border-left: 1px solid var(--line); background: #f8fafc; white-space: nowrap; }
  .invalid .field input, .invalid .money { border-color: var(--high); }

  .error { margin-top: 18px; font-size: 14px; color: var(--high); background: var(--high-soft); border: 1px solid var(--high-line); border-radius: 10px; padding: 10px 14px; }
  .error:empty { display: none; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
  .meta div { display: flex; align-items: center; gap: 6px; }
  .meta svg { width: 15px; height: 15px; }
  button { height: 48px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font: inherit; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; white-space: nowrap; box-shadow: 0 8px 20px -8px rgba(79,70,229,.7), inset 0 1px 0 rgba(255,255,255,.15); }
  button:hover { background: #4338ca; }
  button:focus-visible { outline: 0; box-shadow: 0 0 0 4px rgba(79,70,229,.3); }
  button[disabled] { opacity: .75; cursor: progress; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #result { display: none; margin-top: 20px; border-top-width: 4px; scroll-margin-top: 20px; }
  #result.high { border-top-color: var(--high); }
  #result.medium { border-top-color: var(--medium); }
  #result.low { border-top-color: var(--low); }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .score { font-size: 48px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
  .score small { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .caption { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .badge { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 7px 12px; border-radius: 8px; border: 1px solid; }
  .badge svg { width: 15px; height: 15px; stroke-width: 2.4; }
  .high .badge { color: var(--high); background: var(--high-soft); border-color: var(--high-line); }
  .medium .badge { color: var(--medium); background: var(--medium-soft); border-color: var(--medium-line); }
  .low .badge { color: var(--low); background: var(--low-soft); border-color: var(--low-line); }
  .meter { margin-top: 20px; height: 8px; border-radius: 99px; background: #f1f5f9; overflow: hidden; }
  .meter div { height: 100%; border-radius: 99px; }
  .note { margin-top: 12px; font-size: 14px; color: var(--muted); font-style: italic; }

  .section { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line); }
  .section h3 { font-size: 12.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .section p { font-size: 15px; line-height: 1.65; color: var(--body); }
  .dim { display: flex; align-items: center; gap: 12px; margin: 10px 0; font-size: 14px; color: var(--body); }
  .dim span { width: 150px; flex: none; }
  .dim b { width: 30px; text-align: right; font-weight: 600; color: var(--ink); }
  .track { flex: 1; height: 8px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; }
  .flags { list-style: none; display: grid; gap: 10px; }
  .flags li { display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--body); }
  .flags li::before { content: ''; flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; }
  .flags.red li::before { background: var(--high); }
  .flags.green li::before { background: var(--low); }
  .checks { list-style: none; display: grid; gap: 6px; font-size: 13.5px; color: var(--muted); }
  .model { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }

  @media (max-width: 640px) {
    nav { padding: 16px; }
    main { padding: 0 16px 48px; margin-top: 16px; }
    h1 { font-size: 34px; }
    .lede { font-size: 16px; }
    .card { padding: 22px 18px; border-radius: 16px; }
    .grid { grid-template-columns: 1fr; }
    .foot { flex-direction: column-reverse; align-items: stretch; }
    .dim span { width: 118px; }
  }
</style>
</head>
<body>
<nav>
  <div class="logo"><div class="mark"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></div>Job Scam Detector</div>
  <a class="report" href="https://cybercrime.gov.in" target="_blank" rel="noopener">Report a scam</a>
</nav>
<main>
  <div class="intro">
    <div class="pill"><span class="dot"></span>Free check · AI-powered</div>
    <h1>Is this job offer legit?</h1>
    <p class="lede">Enter the details from the offer letter or recruiter message. We'll flag the warning signs before you share documents or pay anything.</p>
  </div>

  <form id="jobForm" class="card" novalidate>
    <div class="grid">
      <div>
        <label for="company">Company</label>
        <div class="field"><input id="company" placeholder="e.g. Infolexus Solutions" autocomplete="organization"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></svg></div>
      </div>
      <div>
        <label for="jobTitle">Job title</label>
        <div class="field"><input id="jobTitle" placeholder="e.g. Software Developer"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div>
      </div>
      <div>
        <label for="email">Contact email</label>
        <div class="field"><input id="email" type="email" placeholder="e.g. hr@company.com" autocomplete="off"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></div>
      </div>
      <div>
        <label for="location">Location</label>
        <div class="field"><input id="location" placeholder="e.g. Madurai, Tamil Nadu"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
      </div>
      <div class="full">
        <label for="salary">Offered salary <span>· numbers only</span></label>
        <div class="money">
          <select id="currency" aria-label="Currency">
            <option value="INR" selected>₹ INR</option>
            <option value="USD">$ USD</option>
          </select>
          <input id="salary" inputmode="numeric" placeholder="e.g. 500000">
          <div class="per">per year</div>
        </div>
      </div>
    </div>
    <p id="formError" class="error" role="alert"></p>
    <div class="foot">
      <div class="meta">
        <div><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>No sign-up needed</div>
        <div><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>Checks email, salary &amp; company</div>
      </div>
      <button id="analyzeBtn" type="submit">Analyze offer <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    </div>
  </form>

  <section id="result" class="card" aria-live="polite"></section>
</main>
<script>
const FIELD_IDS = ['company', 'jobTitle', 'email', 'salary', 'location'];

const DIMENSIONS = [
  ['companyLegitimacy', 'Company legitimacy'],
  ['emailDomain', 'Email domain'],
  ['salaryRealism', 'Salary realism'],
  ['offerQuality', 'Offer quality'],
  ['scamPatterns', 'Scam patterns'],
];

const LEVELS = {
  HIGH: { label: 'High risk', color: '#dc2626' },
  MEDIUM: { label: 'Medium risk', color: '#d97706' },
  LOW: { label: 'Low risk', color: '#16a34a' },
};

const ALERT_ICON = '<svg viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>';

const btn = document.getElementById('analyzeBtn');
const btnLabel = btn.innerHTML;
const formError = document.getElementById('formError');
const resultDiv = document.getElementById('result');

function esc(text) {
  return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function scoreColor(score) {
  return score >= 70 ? '#16a34a' : score >= 40 ? '#d97706' : '#dc2626';
}

function list(title, items, cls) {
  if (!items || !items.length) return '';
  return `<div class="section"><h3>${title}</h3><ul class="${cls}">${items.map(item => `<li>${esc(item)}</li>`).join('')}</ul></div>`;
}

function renderAnalysis(a) {
  const level = LEVELS[a.level] || { label: `${a.level} risk`, color: '#64748b' };
  const bars = DIMENSIONS.map(([key, label]) => `
    <div class="dim">
      <span>${label}</span>
      <div class="track"><div class="fill" style="width:${a.scores[key]}%; background:${scoreColor(a.scores[key])}"></div></div>
      <b>${a.scores[key]}</b>
    </div>`).join('');
  return `
    <div class="head">
      <div>
        <div class="score">${a.riskScore}<small> /100</small></div>
        <div class="caption">Risk score</div>
      </div>
      <span class="badge">${a.level === 'LOW' ? CHECK_ICON : ALERT_ICON}${level.label}</span>
    </div>
    <div class="meter"><div style="width:${a.riskScore}%; background:${level.color}"></div></div>
    ${a.verdictNote ? `<p class="note">${esc(a.verdictNote)}</p>` : ''}
    <div class="section"><h3>Scores · higher is safer</h3>${bars}</div>
    ${list('Red flags', a.redFlags, 'flags red')}
    ${list('Green flags', a.greenFlags, 'flags green')}
    ${a.reasoning ? `<div class="section"><h3>Reasoning</h3><p>${esc(a.reasoning)}</p></div>` : ''}
    ${a.recommendation ? `<div class="section"><h3>Recommendation</h3><p>${esc(a.recommendation)}</p></div>` : ''}
    ${list('Automated checks', a.checks && a.checks.summary, 'checks')}
    <p class="model">Analyzed by ${esc(a.model)}</p>`;
}

function setLoading(loading) {
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spinner"></span>Analyzing…' : btnLabel;
}

async function analyzeJob() {
  const values = Object.fromEntries(FIELD_IDS.map(id => [id, document.getElementById(id).value.trim()]));
  const currency = document.getElementById('currency').value;
  const missing = FIELD_IDS.filter(id => !values[id]);

  FIELD_IDS.forEach(id => document.getElementById(id).closest('.grid > div').classList.toggle('invalid', missing.includes(id)));
  if (missing.length) {
    formError.textContent = 'Please fill in all fields.';
    document.getElementById(missing[0]).focus();
    return;
  }

  formError.textContent = '';
  resultDiv.style.display = 'none';
  setLoading(true);
  try {
    const res = await fetch('/api/analyze-job', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...values, currency })
    });
    const data = await res.json();
    if (data.error) {
      formError.textContent = 'Error: ' + data.error;
      return;
    }
    resultDiv.innerHTML = renderAnalysis(data.analysis);
    resultDiv.className = 'card ' + String(data.analysis.level).toLowerCase();
    resultDiv.style.display = 'block';
    resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    formError.textContent = 'Error: ' + err.message;
  } finally {
    setLoading(false);
  }
}

document.getElementById('jobForm').addEventListener('submit', e => {
  e.preventDefault();
  analyzeJob();
});

FIELD_IDS.forEach(id => document.getElementById(id).addEventListener('input', e => {
  e.target.closest('.grid > div').classList.remove('invalid');
  if (!document.querySelector('.invalid')) formError.textContent = '';
}));
</script>
</body>
</html>
